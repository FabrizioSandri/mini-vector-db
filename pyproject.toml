[project]
name = "mvdb"
version = "0.1.0"
description = "MVDB (Mini Vector DB): a mini implementation of a Vector DB based on HNSW"
authors = [
    { name = "FabrizioSandri", email = "dev.fabriziosandri@gmail.com" }
]
requires-python = ">=3.13"
dependencies = []

[build-system]
requires = [
  "scikit-build-core>=0.10",
  "pybind11>=2.13",
]
build-backend = "scikit_build_core.build"

[tool.scikit-build]
wheel.packages = ["python/mvdb"]
sdist.include = ["include", "src", "CMakeLists.txt", "vcpkg.json"]
build-dir = "build/{wheel_tag}"

[tool.scikit-build.cmake.define]
MVDB_BUILD_MAIN = "OFF"


[dependency-groups]
dev = [
  "ipykernel>=7.3.0",
  "numpy>=2.5.3",
  "pytest>=8.0",
]
