[project]
name = "mvdb"
version = "0.1.0"
description = "MVDB (Mini Vector DB): a mini implementation of a Vector DB based on HNSW"
authors = [
    { name = "FabrizioSandri", email = "dev.fabriziosandri@gmail.com" }
]
requires-python = ">=3.10"
dependencies = [
  "numpy>=2.0.0"
]

[build-system]
requires = ["uv_build>=0.12.17,<0.13"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-root = "python"
module-name = "mvdb"

[dependency-groups]
dev = [
  "ipykernel>=7.3.0",
  "pytest>=8.0",
  "pybind11>=3.1.0",
  "tqdm>=4.70.1",
]
